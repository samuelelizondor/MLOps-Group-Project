# environment.yml: conda environment for the RideQuote trip-time pipeline, tests and notebook.
# Rebuild with: conda env create -f environment.yml
name: ridequote-eta
channels:
  - conda-forge
dependencies:
  - python=3.12

  # Pipeline: what src/ imports to run
  - pandas
  - numpy
  - scikit-learn>=1.9  # KFold as TargetEncoder cv; the saved model loads only with a matching version
  - joblib
  - pyyaml  # reads config.yaml (yaml.safe_load)

  # Development tools: check the code, not needed to run it
  - pytest
  - pytest-cov  # coverage report: pytest --cov=src
  - black  # formatter, run before flake8
  - flake8  # style checker
  - radon  # cyclomatic complexity per function: radon cc src -s
  - pylint  # code quality rating, as the grader runs it: pylint src

  # Notebook only: exploration, never imported by src/
  - matplotlib  # charts
  - pyarrow  # read_parquet for the TLC monthly files (download step)
  - ipykernel  # run the notebook in VS Code with this environment